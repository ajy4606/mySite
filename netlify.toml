[build]
  command = "node tools/build-pages.js"
  publish = "."

# Static project documents provide route-specific metadata. The client router
# preserves in-page transitions and accepts the previously shared hash links.

[[redirects]]
  from = "/bio"
  to = "/info/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/info/"
  status = 301

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS and JS are small and change together with the HTML. Caching them for an
# hour means a deploy can leave a visitor running new markup against old
# scripts — always revalidate instead. 304s keep this cheap.

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/gl/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/works/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
